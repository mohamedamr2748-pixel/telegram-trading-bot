name: Scope intraday candle spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scope_intraday_candle_spacing.yml'

permissions:
  contents: write

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/candlestick_chart.py')
          text = path.read_text(encoding='utf-8')
          old = '    compact_x = frame is None and interval_unit in {"m", "h"}\n'
          new = '    compact_x = frame is None and ((interval_unit == "m" and interval_count in {15, 30}) or (interval_unit == "h" and interval_count in {1, 4}))\n'
          if old not in text:
              raise SystemExit('Expected compact_x expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile app/candlestick_chart.py
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/scope_intraday_candle_spacing.yml
          git add app/candlestick_chart.py .github/workflows/scope_intraday_candle_spacing.yml
          git commit -m 'Scope intraday candle spacing to 15m 30m 1h 4h'
          git push origin main
