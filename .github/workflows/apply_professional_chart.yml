name: Apply professional standard price chart

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: ${{ github.event.issue.title == 'APPLY-PRO-PRICE-CHART' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply chart refinements
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/candlestick_chart.py')
          text = path.read_text(encoding='utf-8')

          if 'def _plot_volume(' in text:
              raise SystemExit('Professional chart refinements already applied; refusing duplicate patch.')

          # 1) Stable, timeframe-aware ticks. For 4H, select only real candle
          # boundaries and subsample those boundaries evenly; labels stay time-only.
          display_ticks = '''def _display_ticks(index: pd.DatetimeIndex, timeframe: str) -> tuple[pd.DatetimeIndex, list[str]]:
              observed = legacy._display_index(index, "")
              if not len(observed):
                  return observed, []
              observed = observed.drop_duplicates().sort_values()
              count, unit = legacy._timeframe_interval(timeframe)

              if count == 4 and unit == "h":
                  aligned = observed[
                      (observed.minute == 0)
                      & (observed.second == 0)
                      & (observed.microsecond == 0)
                      & ((observed.hour % 4) == 0)
                  ]
                  if len(aligned):
                      observed = aligned

                  if len(observed) > 1:
                      target_ticks = 7
                      step = max(1, (len(observed) - 1 + target_ticks - 1) // target_ticks)
                      selected = list(observed[::step])
                      if selected[-1] != observed[-1]:
                          selected.append(observed[-1])
                      ticks = pd.DatetimeIndex(selected)
                  else:
                      ticks = pd.DatetimeIndex(observed)
                  return ticks, [timestamp.strftime("%H:%M") for timestamp in ticks]

              step = legacy._timestamp_tick_step(timeframe, observed[-1] - observed[0])
              ticks = [observed[0]]
              next_target = observed[0] + step
              for timestamp in observed[1:]:
                  if timestamp >= next_target:
                      ticks.append(timestamp)
                      next_target = timestamp + step
              if ticks[-1] != observed[-1]:
                  ticks.append(observed[-1])
              ticks = pd.DatetimeIndex(ticks)

              if len(ticks) <= 1:
                  labels = [ticks[0].strftime("%H:%M")] if len(ticks) else []
                  return ticks, labels

              span = ticks[-1] - ticks[0]
              if unit in {"m", "h"}:
                  date_format = "%d %b\\n%H:%M" if span >= pd.Timedelta(days=2) else "%H:%M"
              elif unit == "mo":
                  date_format = "%b %Y"
              else:
                  date_format = "%b %Y" if span >= pd.Timedelta(days=365) else "%d %b"
              return ticks, [timestamp.strftime(date_format) for timestamp in ticks]


          '''
          pattern = re.compile(r'def _display_ticks\(.*?\n\ndef _candle_width_days', re.DOTALL)
          text, n = pattern.subn(display_ticks + 'def _candle_width_days', text, count=1)
          if n != 1:
              raise SystemExit('Could not replace _display_ticks')

          # 2) Add a clean volume panel below the price candles.
          volume_helper = '''def _plot_volume(ax, work: pd.DataFrame, timeframe: str) -> None:
              if "Volume" not in work.columns:
                  return
              volume = pd.to_numeric(work["Volume"], errors="coerce").fillna(0)
              if not (volume > 0).any():
                  return
              valid = work.loc[volume.index].copy()
              valid["Volume"] = volume
              width = _candle_width_days(valid.index, timeframe)
              x_values = mdates.date2num(valid.index.to_pydatetime())
              for x_value, row in zip(x_values, valid[["Open", "Close", "Volume"]].itertuples(index=False)):
                  opening, close, amount = map(float, row)
                  if amount <= 0:
                      continue
                  candle_colour = _CANDLE_UP if close >= opening else _CANDLE_DOWN
                  ax.bar(
                      x_value,
                      amount,
                      width=width * 0.82,
                      align="center",
                      color=candle_colour,
                      alpha=0.42,
                      edgecolor="none",
                      linewidth=0,
                      zorder=2,
                  )
              ax.text(0.0, 0.88, "Volume", transform=ax.transAxes, ha="left", va="top", fontsize=8.0, color="#8f96a3")


          '''
          marker = '\ndef _configure_x_axis'
          if marker not in text:
              raise SystemExit('Could not find x-axis insertion point')
          text = text.replace(marker, '\n\n' + volume_helper + 'def _configure_x_axis', 1)

          # 3) Make the y-range include the live quote price as well as candle OHLC.
          text = text.replace(
              'baseline = float(min(low_series.min(), previous if previous is not None else low_series.min()))\n    ceiling = float(max(high_series.max(), previous if previous is not None else high_series.max()))',
              'baseline = float(min(low_series.min(), previous if previous is not None else low_series.min(), last_price))\n    ceiling = float(max(high_series.max(), previous if previous is not None else high_series.max(), last_price))',
              1,
          )

          # 4) Replace the single-panel chart geometry with an optional volume panel.
          old_axes = '    ax = fig.add_axes([0.035, 0.30, 0.865, 0.56])\n    ax.set_facecolor(_BG)\n\n'
          new_axes = '''    has_volume = "Volume" in work.columns and bool((pd.to_numeric(work["Volume"], errors="coerce").fillna(0) > 0).any())
              if has_volume:
                  ax = fig.add_axes([0.035, 0.39, 0.865, 0.47])
                  volume_ax = fig.add_axes([0.035, 0.30, 0.865, 0.075], sharex=ax)
                  volume_ax.set_facecolor(_BG)
                  volume_ax.tick_params(axis="x", labelbottom=True)
                  volume_ax.tick_params(axis="y", left=False, labelleft=False, right=False, labelright=False, length=0)
                  for spine in volume_ax.spines.values():
                      spine.set_visible(False)
                  volume_ax.grid(axis="y", color=_GRID, linestyle="-", linewidth=0.55, alpha=0.45)
              else:
                  ax = fig.add_axes([0.035, 0.30, 0.865, 0.56])
                  volume_ax = None
              ax.set_facecolor(_BG)

          '''
          if old_axes not in text:
              raise SystemExit('Could not replace chart axes geometry')
          text = text.replace(old_axes, new_axes, 1)

          # 5) Draw volume after candles.
          text = text.replace(
              '    _plot_candles(ax, work, timeframe)\n\n    if previous is not None:',
              '    _plot_candles(ax, work, timeframe)\n    if volume_ax is not None:\n        _plot_volume(volume_ax, work, timeframe)\n\n    if previous is not None:',
              1,
          )

          # 6) Add an always-visible live price guide, distinct from Prev. close.
          current_line = '''    ax.axhline(last_price, linewidth=0.9, linestyle=(0, (2, 4)), color=session_colour, alpha=0.72, zorder=3)
              ax.text(1.002, last_price, legacy._fmt_value(last_price, digits), transform=ax.get_yaxis_transform(), ha="left", va="center", fontsize=8.5, color=session_colour)

          '''
          text = text.replace('    ax.set_ylim(chart_bottom, chart_top)\n', current_line + '    ax.set_ylim(chart_bottom, chart_top)\n', 1)

          # 7) Put the x-axis labels on the volume panel when present, not in the price plot.
          old_xaxis = '''    if frame is not None:
              ax.set_xlim(mdates.date2num(frame.x_min_utc.to_pydatetime()), mdates.date2num(frame.x_max_utc.to_pydatetime()))
              _configure_x_axis(ax, work.index, timeframe, visible_bounds=(frame.x_min_utc, frame.x_max_utc))
          else:
              x = work.index.to_pydatetime()
              if len(x) > 1:
                  ax.set_xlim(x[0], x[-1])
              _configure_x_axis(ax, work.index, timeframe)

          '''
          new_xaxis = '''    tick_ax = volume_ax if volume_ax is not None else ax
              if frame is not None:
                  xmin = mdates.date2num(frame.x_min_utc.to_pydatetime())
                  xmax = mdates.date2num(frame.x_max_utc.to_pydatetime())
                  ax.set_xlim(xmin, xmax)
                  _configure_x_axis(tick_ax, work.index, timeframe, visible_bounds=(frame.x_min_utc, frame.x_max_utc))
              else:
                  x = work.index.to_pydatetime()
                  if len(x) > 1:
                      ax.set_xlim(x[0], x[-1])
                  _configure_x_axis(tick_ax, work.index, timeframe)
              if volume_ax is not None:
                  ax.tick_params(axis="x", labelbottom=False)

          '''
          if old_xaxis not in text:
              raise SystemExit('Could not replace x-axis configuration')
          text = text.replace(old_xaxis, new_xaxis, 1)

          # 8) Replace the Google-Finance-like selector with a clean timeframe badge.
          selector_pattern = re.compile(r'    selector = \[.*?\n\n    chart_date =', re.DOTALL)
          selector_replacement = '    ax.text(0.985, 1.18, f"{timeframe.upper()} • UTC", transform=ax.transAxes, ha="right", va="center", fontsize=9.5, fontweight="bold", color="#cfd4dc")\n\n    chart_date ='
          text, n = selector_pattern.subn(selector_replacement, text, count=1)
          if n != 1:
              raise SystemExit('Could not remove chart selector')

          # 9) Replace footer with last-candle OHLC + the existing asset metadata.
          footer_pattern = re.compile(r'    chart_date = work\.index\[-1\].*?\n    buf = io\.BytesIO\(\)', re.DOTALL)
          footer_replacement = '''    chart_date = work.index[-1].tz_convert(UTC).strftime("%Y-%b-%d")
              fig.add_artist(plt.Line2D([0.035, 0.93], [0.262, 0.262], transform=fig.transFigure, color="#34373b", linewidth=0.9))

              last_candle = work.iloc[-1]
              candle_digits = digits
              ohlc = [
                  ("Open", float(last_candle["Open"])),
                  ("High", float(last_candle["High"])),
                  ("Low", float(last_candle["Low"])),
                  ("Close", float(last_candle["Close"])),
              ]
              ohlc_x = [0.055, 0.255, 0.455, 0.655]
              for xpos, (label, value) in zip(ohlc_x, ohlc):
                  fig.text(xpos, 0.232, label, ha="left", va="center", fontsize=8.8, color="#8f96a3")
                  fig.text(xpos + 0.058, 0.232, legacy._fmt_value(value, candle_digits), ha="left", va="center", fontsize=10.0, fontweight="bold", color="#f8fafc")

              fig.text(0.86, 0.245, chart_date, ha="right", va="center", fontsize=8.3, color="#aab0bb")
              fig.text(0.86, 0.220, f"{timeframe.upper()} • UTC", ha="right", va="center", fontsize=8.0, fontweight="bold", color="#b8bdc7")

              rows = legacy._asset_stats_rows(symbol, quote, stats, period_perf)
              y_positions = [0.190, 0.150, 0.110]
              x_positions_text = [0.055, 0.36, 0.66]
              for ypos, row in zip(y_positions, rows):
                  for xpos, (label, value) in zip(x_positions_text, row):
                      fig.text(xpos, ypos, label, ha="left", va="center", fontsize=8.7, color="#8f96a3")
                      fig.text(xpos + 0.10, ypos, value, ha="left", va="center", fontsize=9.7, fontweight="bold", color="#f8fafc")

              buf = io.BytesIO()'''
          text, n = footer_pattern.subn(footer_replacement, text, count=1)
          if n != 1:
              raise SystemExit('Could not replace footer block')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m compileall -q app

      - name: Commit changes, remove one-time workflow, close trigger issue
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/candlestick_chart.py
          git rm .github/workflows/apply_professional_chart.yml
          git commit -m 'Polish standard price charts'
          git push origin HEAD:main
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}" \
            -d '{"state":"closed"}' >/dev/null
