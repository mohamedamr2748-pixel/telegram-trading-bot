name: Use regular-session candles for standard price charts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove extended-hours history request for stocks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/market.py")
          text = path.read_text(encoding="utf-8")
          old = '''            # Extended-hours data is requested for stocks only. Broad-market
            # indices must not use prepost because Yahoo may reject it.
            if interval.endswith(("m", "h")) and self._classify(symbol) == "stock" and not inverse:
                history_kwargs["prepost"] = True
'''
          new = '''            # Standard /price intraday charts use regular-session candles only.
            # Quote data continues to expose pre/post-market prices separately.
'''
          if old not in text:
              raise SystemExit("Expected extended-hours history block was not found; refusing to modify the file.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/market.py .github/workflows/standard_price_regular_session.yml
          git rm .github/workflows/standard_price_regular_session.yml
          git commit -m "Use regular-session candles for standard price charts"
          git push
