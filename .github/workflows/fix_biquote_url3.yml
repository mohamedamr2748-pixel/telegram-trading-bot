name: Normalize BiQuote OHLC path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix_biquote_url3.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/market.py')
          text = p.read_text()
          old = chr(92) + '/ohlc'
          count = text.count(old)
          print('escaped slash occurrences:', count)
          if count == 0:
              raise SystemExit('No escaped BiQuote OHLC path found')
          p.write_text(text.replace(old, '/ohlc'))
          PY
          python -m compileall -q app
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/market.py
          git rm .github/workflows/fix_biquote_url3.yml
          git commit -m 'Normalize BiQuote OHLC path'
          git push origin HEAD:main
