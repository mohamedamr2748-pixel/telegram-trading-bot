name: One-time account formatting patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app/bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/bot.py")
          handler = Path("scripts/account_handler.txt").read_text(encoding="utf-8")
          text = path.read_text(encoding="utf-8")
          pattern = r'(?s)@router\.message\(Command\("account"\)\)\nasync def account\(message: Message\) -> None:\n.*?(?=\n\n@router\.message\(Command\("price"\)\))'
          new_text, count = re.subn(pattern, lambda _: handler.rstrip("\n"), text, count=1)
          if count != 1:
              raise SystemExit("Account handler pattern not found")
          path.write_text(new_text, encoding="utf-8")
          PY
      - name: Commit bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot.py
          git diff --cached --quiet && exit 1
          git commit -m "Fix account formatting in bot.py"
          git push
      - name: Remove one-time files
        if: always()
        run: |
          rm -f .github/workflows/one_time_account_patch.yml scripts/account_handler.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one_time_account_patch.yml scripts/account_handler.txt
          git diff --cached --quiet || git commit -m "Remove one-time account patch files"
          git push || true