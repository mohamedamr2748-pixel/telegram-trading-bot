name: Fix account handler formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix account handler formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace account handler
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('app/bot.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '@router.message(Command("account"))\nasync def account(message: Message) -> None:'
          end_marker = '\n@router.message(Command("price"))'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = dedent('''
          @router.message(Command("account"))
          async def account(message: Message) -> None:
              from datetime import date
              from app.db import Usage

              async with session_factory() as session:
                  user = await get_or_create_user(session, message.from_user.id, message.from_user.username)
                  watch_count = await session.scalar(select(func.count(WatchlistItem.id)).join(Watchlist).where(Watchlist.user_id == user.id)) or 0
                  alerts = await session.scalar(select(func.count(Alert.id)).where(Alert.user_id == user.id, Alert.active.is_(True), Alert.alert_type == "price")) or 0
                  smart = await session.scalar(select(func.count(Alert.id)).where(Alert.user_id == user.id, Alert.active.is_(True), Alert.alert_type == "smart")) or 0
                  usage_result = await session.execute(
                      select(Usage.key, Usage.count).where(
                          Usage.user_id == user.id,
                          Usage.day == date.today(),
                      )
                  )
                  usage = dict(usage_result.all())
                  await message.answer(
                      "👤 <b>MY ACCOUNT</b>\\n\\n"
                      "<b>PLAN</b>\\n"
                      f"Plan              <b>{user.plan.title()}</b>\\n\\n"
                      "<b>PORTFOLIO</b>\\n"
                      f"Watchlist         <code>{watch_count} / 10</code>\\n"
                      f"Price alerts      <code>{alerts} / 3</code>\\n"
                      f"Smart alerts      <code>{smart} / 3</code>\\n\\n"
                      "<b>SETTINGS</b>\\n"
                      f"Timezone          <code>{user.timezone}</code>\\n\\n"
                      "<b>USAGE • TODAY</b>\\n"
                      f"Price             <code>{usage.get('price', 0)} / 50</code>\\n"
                      f"Charts            <code>{usage.get('chart', 0)} / 10</code>\\n"
                      f"News              <code>{usage.get('news', 0)} / 30</code>\\n"
                      f"Scanner           <code>{usage.get('scanner', 0)} / 5</code>\\n"
                      f"Brief             <code>{usage.get('brief', 0)} / 1</code>\\n"
                      f"Why               <code>{usage.get('why', 0)} / 3</code>\\n"
                      f"Advanced          <code>{usage.get('advanced', 0)} / 3</code>"
                  )
          ''').lstrip()

          path.write_text(text[:start] + replacement.rstrip() + text[end:], encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile app/bot.py
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot.py
          git commit -m "Fix account formatting in bot.py"
          rm -f .github/workflows/fix-account-format.yml
          git add .github/workflows/fix-account-format.yml
          git commit -m "Remove one-time account format workflow"
          git push