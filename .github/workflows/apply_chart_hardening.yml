name: Apply chart hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Prepare chart hardening refactor'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply hardening changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # chart_sessions.py: align with the provider's classification model,
          # while explicitly covering precious-metal symbols.
          replace(
              'app/chart_sessions.py',
              '    if s.endswith("=F"):\n        return AssetKind.COMMODITY\n',
              '    if s.endswith("=F"):\n        return AssetKind.COMMODITY\n    if compact in {"XAUUSD", "XAGUSD"}:\n        return AssetKind.COMMODITY\n',
          )
          replace(
              'app/chart_sessions.py',
              '    if quote_asset_class:\n        qc = quote_asset_class.lower()\n        if qc == "crypto":\n            return AssetKind.CRYPTO\n        if qc == "forex":\n            return AssetKind.FOREX\n        if qc in {"commodity", "metal", "futures"}:\n            return AssetKind.COMMODITY\n        if qc in {"stock", "index", "equity"}:\n            return AssetKind.US_EQUITY\n    return AssetKind.OTHER\n',
              '    if quote_asset_class:\n        qc = quote_asset_class.lower()\n        if qc == "crypto":\n            return AssetKind.CRYPTO\n        if qc == "forex":\n            return AssetKind.FOREX\n        if qc in {"commodity", "metal", "futures"}:\n            return AssetKind.COMMODITY\n        if qc in {"stock", "index", "equity"}:\n            return AssetKind.US_EQUITY\n\n    # Match the application's market-provider default: ordinary symbols are\n    # treated as US stocks unless their symbol family explicitly identifies\n    # another asset class. This keeps chart session handling from silently\n    # falling back to a data-extent chart for AAPL-like tickers when metadata\n    # is unavailable.\n    if s and s.replace(".", "").isalnum() and "=" not in s and ":" not in s and "/" not in s:\n        return AssetKind.US_EQUITY\n    return AssetKind.OTHER\n',
          )

          # domain.py: cache the corrected yfinance previous close per trading date.
          replace(
              'app/domain.py',
              '    post_market_price: float | None = None\n\n    def __post_init__(self) -> None:\n',
              '    post_market_price: float | None = None\n    corrected_previous_close: float | None = None\n    corrected_for_trading_date: str | None = None\n\n    def __post_init__(self) -> None:\n',
          )

          # charts.py: remove unused helper and add robust rendering refinements.
          replace(
              'app/charts.py',
              'def _pre_market(quote: MarketQuote | None) -> str:\n    if not quote or quote.pre_market_price is None:\n        return "n/a"\n    move = ((quote.pre_market_price / quote.previous_close) - 1) * 100 if quote.previous_close else None\n    return f"{_fmt_value(quote.pre_market_price)}  ({_fmt_percent(move)})" if move is not None else _fmt_value(quote.pre_market_price)\n\n\n',
              '',
          )

          replace(
              'app/charts.py',
              'def _configure_us_equity_x_axis(ax, frame: TradingFrame) -> None:\n    ax.set_xlim(frame.x_min_utc.to_pydatetime(), frame.x_max_utc.to_pydatetime())\n    ax.xaxis.set_major_locator(mdates.HourLocator(byhour=range(0, 24, 2), tz=UTC))\n    ax.xaxis.set_major_formatter(mdates.DateFormatter("%H:%M", tz=UTC))\n    ax.xaxis.get_offset_text().set_visible(False)\n\n\n',
              'def _draw_session_boundaries(ax, frame: TradingFrame) -> None:\n    """Mark the regular-session boundaries without competing with the data."""\n    if frame.regular_utc is None:\n        return\n    for boundary in frame.regular_utc:\n        ax.axvline(\n            boundary,\n            color="#fbbf24",\n            linewidth=0.7,\n            linestyle=(0, (2, 6)),\n            alpha=0.32,\n            zorder=1,\n        )\n\n\ndef _configure_us_equity_x_axis(ax, frame: TradingFrame) -> None:\n    x_min = mdates.date2num(frame.x_min_utc.to_pydatetime())\n    x_max = mdates.date2num(frame.x_max_utc.to_pydatetime())\n    pad = (x_max - x_min) * 0.03\n    ax.set_xlim(x_min - pad, x_max + pad)\n    ax.xaxis.set_major_locator(mdates.HourLocator(byhour=range(0, 24, 2), tz=UTC))\n    ax.xaxis.set_major_formatter(mdates.DateFormatter("%H:%M", tz=UTC))\n    ax.xaxis.get_offset_text().set_visible(False)\n\n\n',
          )

          replace(
              'app/charts.py',
              'async def _correct_yfinance_previous_close(symbol: str, quote: MarketQuote | None, timeframe: str) -> float | None:\n    if quote is None or quote.source != "yfinance" or not timeframe.upper().startswith("1D"):\n        return quote.previous_close if quote else None\n    try:\n        from app.market import MarketService\n        daily = await MarketService().get_history(symbol, period="5d", interval="1d")\n        if "Close" not in daily.columns:\n            return quote.previous_close\n        daily = daily.copy()\n        daily["Close"] = pd.to_numeric(daily["Close"], errors="coerce")\n        daily = daily.dropna(subset=["Close"]).sort_index()\n        if len(daily) >= 2:\n            return float(daily["Close"].iloc[-2])\n    except Exception:\n        pass\n    return quote.previous_close\n\n\n',
              'async def _correct_yfinance_previous_close(\n    symbol: str,\n    quote: MarketQuote | None,\n    timeframe: str,\n    trading_date_iso: str | None,\n) -> float | None:\n    if quote is None or quote.source != "yfinance" or not timeframe.upper().startswith("1D"):\n        return quote.previous_close if quote else None\n    if (\n        quote.corrected_previous_close is not None\n        and quote.corrected_for_trading_date == trading_date_iso\n    ):\n        return quote.corrected_previous_close\n    try:\n        from app.market import MarketService\n        daily = await MarketService().get_history(symbol, period="5d", interval="1d")\n        if "Close" not in daily.columns:\n            return quote.previous_close\n        daily = daily.copy()\n        daily["Close"] = pd.to_numeric(daily["Close"], errors="coerce")\n        daily = daily.dropna(subset=["Close"]).sort_index()\n        if len(daily) >= 2:\n            corrected = float(daily["Close"].iloc[-2])\n            quote.corrected_previous_close = corrected\n            quote.corrected_for_trading_date = trading_date_iso\n            return corrected\n    except Exception:\n        pass\n    return quote.previous_close\n\n\n',
          )

          # Rebuild the beginning of render_google_finance_chart so the display
          # frame exists before previous-close correction and no-quote colouring
          # has a truthful fallback.
          replace(
              'app/charts.py',
              '    if quote is not None:\n        price = quote.price if price is None else price\n        currency = currency or ("USD" if quote.asset_class in {"stock", "index", "commodity", "metal", "forex", "market"} else None)\n        corrected_previous = await _correct_yfinance_previous_close(symbol, quote, timeframe)\n        if prev_close is None or quote.source == "yfinance":\n            prev_close = corrected_previous\n        if prev_close and prev_close > 0 and price is not None:\n            change_percent = (price / prev_close - 1.0) * 100.0\n        elif change_percent is None:\n            change_percent = quote.change_percent\n\n    is_1d = timeframe.upper().startswith("1D")\n',
              '    if quote is not None:\n        price = quote.price if price is None else price\n        currency = currency or ("USD" if quote.asset_class in {"stock", "index", "commodity", "metal", "forex", "market"} else None)\n        if prev_close is None and quote.previous_close is not None:\n            prev_close = quote.previous_close\n        if prev_close and prev_close > 0 and price is not None:\n            change_percent = (price / prev_close - 1.0) * 100.0\n        elif change_percent is None:\n            change_percent = quote.change_percent\n\n    is_1d = timeframe.upper().startswith("1D")\n    frame = build_frame(symbol, work.index[-1], quote.asset_class if quote else None) if is_1d else None\n    trading_date_iso = frame.trading_date.isoformat() if frame and frame.trading_date else None\n\n    if quote is not None and quote.source == "yfinance" and is_1d:\n        corrected_previous = await _correct_yfinance_previous_close(symbol, quote, timeframe, trading_date_iso)\n        if corrected_previous is not None:\n            prev_close = corrected_previous\n            if price is not None and prev_close > 0:\n                change_percent = (price / prev_close - 1.0) * 100.0\n',
          )

          replace(
              'app/charts.py',
              '    is_1d = timeframe.upper().startswith("1D")\n    frame = build_frame(symbol, work.index[-1], quote.asset_class if quote else None) if is_1d else None\n    trading_date_iso = frame.trading_date.isoformat() if frame and frame.trading_date else None\n',
              '    is_1d = timeframe.upper().startswith("1D")\n',
          )

          # The previous replacement needs the frame assignment exactly once,
          # immediately before the yfinance correction. Insert it before that block.
          replace(
              'app/charts.py',
              '    if quote is not None and quote.source == "yfinance" and is_1d:\n',
              '    frame = build_frame(symbol, work.index[-1], quote.asset_class if quote else None) if is_1d else None\n    trading_date_iso = frame.trading_date.isoformat() if frame and frame.trading_date else None\n\n    if quote is not None and quote.source == "yfinance" and is_1d:\n',
          )

          replace(
              'app/charts.py',
              '    previous = float(prev_close) if prev_close and prev_close > 0 else None\n    if is_1d:\n        if change_percent is None and previous:\n            change_percent = (last_price / previous - 1.0) * 100.0\n    else:\n        first = float(work["Close"].iloc[0])\n        change_percent = (last_price / first - 1.0) * 100.0 if first else None\n        previous = first\n\n    frame = build_frame(symbol, work.index[-1], quote.asset_class if quote else None) if is_1d else None\n',
              '    previous = float(prev_close) if prev_close and prev_close > 0 else None\n    first_close = float(work["Close"].iloc[0])\n    if is_1d:\n        if change_percent is None and previous:\n            change_percent = (last_price / previous - 1.0) * 100.0\n        elif change_percent is None and first_close > 0 and len(work) >= 2:\n            change_percent = (last_price / first_close - 1.0) * 100.0\n    else:\n        if first_close > 0:\n            change_percent = (last_price / first_close - 1.0) * 100.0\n        previous = first_close\n\n',
          )

          # Draw subtle regular-session boundary markers.
          replace(
              'app/charts.py',
              '    if frame is not None:\n        _plot_session_coloured_line(ax, work.index, y, frame, line_color, chart_bottom)\n',
              '    if frame is not None:\n        _plot_session_coloured_line(ax, work.index, y, frame, line_color, chart_bottom)\n        _draw_session_boundaries(ax, frame)\n',
          )

          # Remove any obsolete helper references.
          text = Path('app/charts.py').read_text()
          if '_resolve_quote' in text:\n              raise SystemExit('Unexpected _resolve_quote reference found in charts.py')

          # bot.py: fetch quote once and pass it to the renderer.
          replace(
              'app/bot.py',
              '        df = await market.get_history(symbol, period=period, interval=interval)\n        image = await render_chart(df, symbol, f"{period}/{interval}", advanced=advanced)\n',
              '        df = await market.get_history(symbol, period=period, interval=interval)\n        try:\n            quote = await market.get_quote(symbol)\n        except Exception:\n            quote = None\n        image = await render_chart(df, symbol, f"{period}/{interval}", advanced=advanced, quote=quote)\n',
          )
          replace(
              'app/bot.py',
              '        df = await market.get_history(symbol, "1mo", "1d")\n        image = await render_chart(df, symbol, "1mo/1d")\n',
              '        df = await market.get_history(symbol, "1mo", "1d")\n        try:\n            quote = await market.get_quote(symbol)\n        except Exception:\n            quote = None\n        image = await render_chart(df, symbol, "1mo/1d", quote=quote)\n',
          )

          # market_dashboard.py: same quote reuse for dashboard charts.
          replace(
              'app/market_dashboard.py',
              '        market = MarketService()\n        df = await market.get_history(symbol, period="1d", interval="15m")\n        image = await render_chart(df, symbol, "1d/15m")\n',
              '        market = MarketService()\n        df = await market.get_history(symbol, period="1d", interval="15m")\n        try:\n            quote = await market.get_quote(symbol)\n        except Exception:\n            quote = None\n        image = await render_chart(df, symbol, "1d/15m", quote=quote)\n',
          )

          # Replace the failing/obsolete chart-session tests with deterministic
          # tests for the intended architecture.
          Path('tests/test_chart_sessions.py').write_text('''import pandas as pd\n\nfrom app import chart_sessions as cs\nfrom app import charts\nfrom app.market import YFinanceProvider\n\n\ndef test_asset_classification_common_symbols():\n    assert cs.classify_asset("AAPL") is cs.AssetKind.US_EQUITY\n    assert cs.classify_asset("^GSPC") is cs.AssetKind.US_EQUITY\n    assert cs.classify_asset("SP500") is cs.AssetKind.US_EQUITY\n    assert cs.classify_asset("BTC-USD") is cs.AssetKind.CRYPTO\n    assert cs.classify_asset("USDBTC") is cs.AssetKind.CRYPTO\n    assert cs.classify_asset("EURUSD=X") is cs.AssetKind.FOREX\n    assert cs.classify_asset("EURUSD") is cs.AssetKind.FOREX\n    assert cs.classify_asset("GC=F") is cs.AssetKind.COMMODITY\n    assert cs.classify_asset("XAUUSD") is cs.AssetKind.COMMODITY\n\n\ndef test_asset_classification_matches_market_provider():\n    for symbol in [\n        "AAPL", "^GSPC", "SP500", "GC=F", "XAUUSD",\n        "BTC-USD", "BTCUSD", "USDBTC", "EURUSD=X", "EURUSD", "USDJPY",\n    ]:\n        provider = YFinanceProvider._classify(symbol)\n        ours = cs.classify_asset(symbol)\n        if provider == "crypto":\n            assert ours is cs.AssetKind.CRYPTO, symbol\n        elif provider == "forex":\n            assert ours is cs.AssetKind.FOREX, symbol\n        elif provider in {"commodity", "metal"}:\n            assert ours is cs.AssetKind.COMMODITY, symbol\n        elif provider in {"stock", "index"}:\n            assert ours is cs.AssetKind.US_EQUITY, symbol\n\n\ndef test_est_and_edt_frames_are_dst_safe():\n    winter = cs.build_us_equity_frame(pd.Timestamp("2026-01-12 12:00", tz="UTC"))\n    assert winter.x_min_utc == pd.Timestamp("2026-01-12 09:00", tz="UTC")\n    assert winter.regular_utc[0] == pd.Timestamp("2026-01-12 14:30", tz="UTC")\n    assert winter.regular_utc[1] == pd.Timestamp("2026-01-12 21:00", tz="UTC")\n    assert winter.x_max_utc == pd.Timestamp("2026-01-13 01:00", tz="UTC")\n\n    summer = cs.build_us_equity_frame(pd.Timestamp("2026-07-13 12:00", tz="UTC"))\n    assert summer.x_min_utc == pd.Timestamp("2026-07-13 08:00", tz="UTC")\n    assert summer.regular_utc[0] == pd.Timestamp("2026-07-13 13:30", tz="UTC")\n    assert summer.regular_utc[1] == pd.Timestamp("2026-07-13 20:00", tz="UTC")\n    assert summer.x_max_utc == pd.Timestamp("2026-07-14 00:00", tz="UTC")\n\n\ndef test_weekend_falls_back_to_previous_friday():\n    frame = cs.build_us_equity_frame(pd.Timestamp("2026-09-12 15:00", tz="UTC"))\n    assert frame.trading_date.strftime("%Y-%m-%d") == "2026-09-11"\n\n\ndef test_session_classification():\n    frame = cs.build_us_equity_frame(pd.Timestamp("2026-09-11 18:00", tz="UTC"))\n    d = frame.trading_date\n    assert cs.classify_timestamp(pd.Timestamp("2026-09-11 12:00", tz="UTC"), d) is cs.SessionKind.PREMARKET\n    assert cs.classify_timestamp(pd.Timestamp("2026-09-11 14:30", tz="UTC"), d) is cs.SessionKind.REGULAR\n    assert cs.classify_timestamp(pd.Timestamp("2026-09-11 19:45", tz="UTC"), d) is cs.SessionKind.REGULAR\n    assert cs.classify_timestamp(pd.Timestamp("2026-09-11 20:00", tz="UTC"), d) is cs.SessionKind.AFTERMARKET\n    assert cs.classify_timestamp(pd.Timestamp("2026-09-11 23:00", tz="UTC"), d) is cs.SessionKind.AFTERMARKET\n    assert cs.classify_timestamp(pd.Timestamp("2026-09-12 01:00", tz="UTC"), d) is cs.SessionKind.CLOSED\n\n\ndef test_regular_session_mask_uses_centralized_classifier():\n    idx = pd.to_datetime([\n        "2026-09-11 12:00Z",\n        "2026-09-11 13:30Z",\n        "2026-09-11 19:45Z",\n        "2026-09-11 20:00Z",\n        "2026-09-11 23:00Z",\n    ], utc=True)\n    assert charts._regular_session_mask(idx).tolist() == [False, True, True, False, False]\n\n\ndef test_non_us_assets_do_not_get_us_frame():\n    when = pd.Timestamp("2026-09-11 18:00", tz="UTC")\n    assert cs.build_frame("BTC-USD", when) is None\n    assert cs.build_frame("EURUSD=X", when) is None\n    assert cs.build_frame("GC=F", when) is None\n''')

          # Replace chart tests with deterministic network-free tests.
          Path('tests/test_charts.py').write_text('''import pandas as pd\nimport pytest\n\nfrom app import charts\n\n\ndef _series(index, values):\n    return pd.DataFrame({"Close": values}, index=index)\n\n\ndef test_price_cleaning_drops_nat_and_keeps_real_observations():\n    idx = pd.Index(["2026-09-11 15:00+00:00", "not-a-date", "2026-09-11 15:15+00:00"])\n    df = _series(idx, [100, 101, 102])\n    work = charts._prepare_price_series(df)\n    assert len(work) == 2\n    assert work.index.isna().sum() == 0\n    assert work.index.max() == pd.Timestamp("2026-09-11 15:15", tz="UTC")\n\n\ndef test_sub_cent_formatting_never_uses_scientific_notation():\n    for value in (1e-2, 1e-4, 1e-6, 1e-8):\n        assert "e" not in charts._fmt_value(value).lower()\n    assert charts._fmt_value(0.001234) == "0.001234"\n    assert charts._fmt_value(12.5) == "12.50"\n\n\ndef test_us_x_axis_includes_small_display_pad():\n    import matplotlib\n    matplotlib.use("Agg")\n    import matplotlib.pyplot as plt\n\n    frame = __import__('app.chart_sessions', fromlist=['']).build_us_equity_frame(\n        pd.Timestamp("2026-09-11 18:00", tz="UTC")\n    )\n    fig, ax = plt.subplots()\n    try:\n        charts._configure_us_equity_x_axis(ax, frame)\n        xmin, xmax = ax.get_xlim()\n        expected_min = frame.x_min_utc.timestamp() / 86400 + 719163\n        expected_max = frame.x_max_utc.timestamp() / 86400 + 719163\n        assert xmin < expected_min\n        assert xmax > expected_max\n    finally:\n        plt.close(fig)\n\n\n@pytest.mark.asyncio\nasync def test_full_day_chart_uses_us_session_frame(monkeypatch):\n    idx = pd.date_range("2026-09-11 14:30", periods=4, freq="15min", tz="UTC")\n    df = _series(idx, [100, 101, 102, 103])\n    captured = {}\n    original = charts._configure_us_equity_x_axis\n\n    def spy(ax, frame):\n        captured["min"] = frame.x_min_utc\n        captured["max"] = frame.x_max_utc\n        return original(ax, frame)\n\n    monkeypatch.setattr(charts, "_configure_us_equity_x_axis", spy)\n    image = await charts.render_google_finance_chart(df, "AAPL", "1d/15m", prev_close=99, price=103)\n    assert image.getbuffer().nbytes > 0\n    assert captured["min"] == pd.Timestamp("2026-09-11 08:00", tz="UTC")\n    assert captured["max"] == pd.Timestamp("2026-09-12 00:00", tz="UTC")\n\n\n@pytest.mark.asyncio\nasync def test_crypto_does_not_use_us_equity_frame(monkeypatch):\n    idx = pd.date_range("2026-09-11 00:00", periods=6, freq="4h", tz="UTC")\n    df = _series(idx, [50000, 50100, 50200, 50150, 50000, 49900])\n    called = False\n    original = charts._configure_us_equity_x_axis\n\n    def spy(ax, frame):\n        nonlocal called\n        called = True\n        return original(ax, frame)\n\n    monkeypatch.setattr(charts, "_configure_us_equity_x_axis", spy)\n    image = await charts.render_google_finance_chart(df, "BTC-USD", "1d/4h", prev_close=50200, price=49900)\n    assert image.getbuffer().nbytes > 0\n    assert called is False\n\n\n@pytest.mark.asyncio\nasync def test_single_point_chart_does_not_crash():\n    idx = pd.DatetimeIndex([pd.Timestamp("2026-09-11 15:00", tz="UTC")])\n    image = await charts.render_google_finance_chart(_series(idx, [100]), "AAPL", "1d/15m", prev_close=99, price=100)\n    assert image.getbuffer().nbytes > 0\n\n\ndef test_empty_data_raises():\n    df = pd.DataFrame({"Close": []}, index=pd.DatetimeIndex([], tz="UTC"))\n    with pytest.raises(ValueError):\n        charts._prepare_price_series(df)\n\n\n@pytest.mark.asyncio\nasync def test_direction_fallback_without_quote(monkeypatch):\n    idx = pd.date_range("2026-09-11 14:30", periods=4, freq="15min", tz="UTC")\n    df = _series(idx, [100, 101, 102, 103])\n\n    async def fail_quote(symbol):\n        raise RuntimeError("provider unavailable")\n\n    monkeypatch.setattr("app.market.MarketService.get_quote", fail_quote)\n    image = await charts.render_google_finance_chart(df, "AAPL", "1d/15m")\n    assert image.getbuffer().nbytes > 1000\n''')
          PY

      - name: Compile and test
        run: |
          python -m compileall -q .
          pytest -q

      - name: Commit final changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply_chart_hardening.yml
          git add app tests
          git status --short
          git commit -m 'Harden chart rendering and session handling'
          git push
