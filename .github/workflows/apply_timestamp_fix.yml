name: Apply 4H axis fix

on: push

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply 4H-only time labels
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path("app/charts.py")
          s = p.read_text()
          old = '''    if unit in {"m", "h"}:\n        date_format = "%d %b\\n%H:%M" if span >= pd.Timedelta(days=2) else "%H:%M"\n'''
          new = '''    if unit in {"m", "h"}:\n        # 4H charts intentionally show time only, never calendar dates.\n        if count == 4 and unit == "h":\n            date_format = "%H:%M"\n        else:\n            date_format = "%d %b\\n%H:%M" if span >= pd.Timedelta(days=2) else "%H:%M"\n'''
          if old not in s:
              raise SystemExit("Expected timestamp formatter block was not found")
          p.write_text(s.replace(old, new, 1))
          PY
          python -m compileall -q app tests
          pytest -q
      - name: Commit and push
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/charts.py
          git rm .github/workflows/apply_timestamp_fix.yml
          git commit -m "Hide dates on 4H chart axis"
          git push origin HEAD:main
