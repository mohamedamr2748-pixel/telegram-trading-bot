name: Apply exact chart timestamp snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'Fix timeframe-aware chart timestamps' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write exact app/charts.py and tests/test_charts.py
        shell: bash
        env:
          CHARTS_B64: >-
            "
          TESTS_B64: >-
            
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path

          targets = {
              Path('app/charts.py'): (os.environ['CHARTS_B64'], 'ea695413a046f41dc4369114786d3998eab38c80b4fe8871dd6fcd20b1cf6848'),
              Path('tests/test_charts.py'): (os.environ['TESTS_B64'], 'b2b4de0fe9768417bcb6498e8bed56aef54f7581e18b405ec12beb3a3dd6fb3f'),
          }
          for path, (encoded, expected_sha) in targets.items():
              data = gzip.decompress(base64.b64decode(encoded))
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected_sha:
                  raise SystemExit(f'{path}: SHA mismatch {actual} != {expected_sha}')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('Exact snapshot files written and SHA-256 verified.')
          PY

      - name: Verify exact snapshot
        env:
          PYTHONPATH: .
          BOT_TOKEN: test-token
        run: |
          python -m compileall -q app tests
          pytest -q

      - name: Commit only two source/test files and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply_timestamp_fix.yml
          git add app/charts.py tests/test_charts.py
          files="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply_timestamp_fix.yml' 'app/charts.py' 'tests/test_charts.py')"
          test "$files" = "$expected" || { echo 'Unexpected staged files:'; printf '%s\n' "$files"; exit 1; }
          git commit -m 'Fix timeframe-aware chart timestamps'
          git push origin HEAD:main
